services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/home/jobmate/JobMate:cached
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 8080:8080
      - 5173:5173
    networks:
      - jobmate-network
  mysql:
    image: mysql:8.0
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - jobmate-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 5
  redis:
    image: redis:7.2-alpine
    env_file:
      - .env
    volumes:
      - redis-data:/data
    ports:
      - 6379:6379
    command: ["sh", "-c", "redis-server --requirepass ${REDIS_PASSWORD}"]
    networks:
      - jobmate-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 10s
      retries: 5

networks:
  jobmate-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
